<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote Generator & Auto-Post</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <i class="fas fa-quote-left"></i>
                <h1>Daily Quote</h1>
            </div>
            <div class="status-badge" id="statusBadge">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">Stopped</span>
            </div>
        </header>

        <div class="stats-bar">
            <div class="stat-item">
                <i class="fas fa-clock"></i>
                <div>
                    <span class="stat-label">Last Post</span>
                    <span class="stat-value" id="lastPost">Never</span>
                </div>
            </div>
            <div class="stat-item">
                <i class="fas fa-calendar-alt"></i>
                <div>
                    <span class="stat-label">Auto Posts</span>
                    <span class="stat-value" id="totalPosts">0</span>
                </div>
            </div>
            <div class="stat-item">
                <i class="fas fa-database"></i>
                <div>
                    <span class="stat-label">Quotes Used</span>
                    <span class="stat-value" id="totalUsed">0</span>
                </div>
            </div>
            <div class="stat-item">
                <i class="fas fa-check-circle"></i>
                <div>
                    <span class="stat-label">Posted</span>
                    <span class="stat-value" id="totalPosted">0</span>
                </div>
            </div>
        </div>

        <div class="main-content">
            <div class="preview-panel">
                <div class="panel-header">
                    <h2><i class="fas fa-image"></i> Quote Preview</h2>
                </div>
                <div class="quote-preview" id="quotePreview">
                    <div class="loading-placeholder">
                        <i class="fas fa-quote-left"></i>
                        <p>Generate a quote to preview</p>
                    </div>
                </div>
                <div class="quote-details" id="quoteDetails" style="display: none;">
                    <div class="detail-item">
                        <span class="label">Quote:</span>
                        <span class="value" id="previewQuote"></span>
                    </div>
                    <div class="detail-item">
                        <span class="label">Author:</span>
                        <span class="value" id="previewAuthor"></span>
                    </div>
                </div>
            </div>

            <div class="controls-panel">
                <div class="panel-header">
                    <h2><i class="fas fa-bolt"></i> Quick Actions</h2>
                </div>
                
                <div class="control-group">
                    <button class="btn btn-primary btn-lg" id="generateBtn">
                        <i class="fas fa-sync-alt"></i> Generate & Preview
                    </button>
                    <button class="btn btn-success btn-lg" id="postBtn" disabled>
                        <i class="fas fa-share"></i> Post Now
                    </button>
                </div>

                <div class="control-group">
                    <div class="input-group">
                        <label><i class="fas fa-tags"></i> Hashtags</label>
                        <input type="text" id="hashtagsInput" placeholder="#Quote #Inspiration #Motivation">
                    </div>
                </div>

                <div class="panel-header" style="margin-top: 20px;">
                    <h2><i class="fas fa-robot"></i> Auto-Post Control</h2>
                </div>

                <div class="control-group">
                    <div class="auto-controls">
                        <div class="interval-control">
                            <label><i class="fas fa-clock"></i> Interval</label>
                            <div class="interval-input">
                                <input type="number" id="intervalInput" value="20" min="1">
                                <span>minutes</span>
                            </div>
                            <button class="btn btn-secondary" id="updateIntervalBtn">
                                <i class="fas fa-save"></i> Update
                            </button>
                        </div>
                    </div>
                </div>

                <div class="control-group">
                    <button class="btn btn-warning btn-lg" id="startAutoBtn">
                        <i class="fas fa-play"></i> Start Auto-Post
                    </button>
                    <button class="btn btn-danger btn-lg" id="stopAutoBtn" disabled>
                        <i class="fas fa-stop"></i> Stop Auto-Post
                    </button>
                </div>

                <div class="panel-header" style="margin-top: 20px;">
                    <h2><i class="fas fa-cog"></i> Management</h2>
                </div>

                <div class="control-group">
                    <button class="btn btn-secondary" id="viewLogBtn">
                        <i class="fas fa-history"></i> View Log
                    </button>
                    <button class="btn btn-danger" id="resetBtn">
                        <i class="fas fa-trash"></i> Reset All
                    </button>
                </div>
            </div>
        </div>

        <div class="modal" id="logModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2><i class="fas fa-history"></i> Post Log</h2>
                    <span class="close" id="closeLog">&times;</span>
                </div>
                <div class="modal-body" id="logContent">
                    <div class="loading">Loading...</div>
                </div>
            </div>
        </div>

        <div class="toast" id="toast">
            <div class="toast-content">
                <i class="fas fa-check-circle" id="toastIcon"></i>
                <span id="toastMessage">Success!</span>
            </div>
        </div>
    </div>

    <script src="/js/script.js"></script>
</body>
</html>
